name: Test DriveLegal India

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m py_compile app.py app_core.py

      - name: Validate JSON data
        run: |
          python -m json.tool data/national_fines.json >/dev/null
          python -m json.tool data/vehicle_types.json >/dev/null
          python -m json.tool data/state_data.json >/dev/null
          python -m json.tool data/metadata.json >/dev/null

      - name: Run tests
        run: pytest -q
